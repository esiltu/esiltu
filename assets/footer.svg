<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110" role="img" aria-label="Automation × Software, engineered with Claude">
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#06121A"/><stop offset=".6" stop-color="#0A2230"/><stop offset="1" stop-color="#0C3324"/></linearGradient>
    <clipPath id="r"><rect width="1000" height="110" rx="18"/></clipPath>
    <style>
  .sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
  .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
  /* Inhoud (tekst, kaarten, iconen) beweegt nooit: die is altijd zichtbaar, ook als een
     renderer animaties bevriest. Alleen decoratie beweegt: glans, stroming, lichtpuntjes. */
  .sweep{animation:sweep 7s cubic-bezier(.4,0,.2,1) infinite}
  @keyframes sweep{0%{transform:translateX(0)}55%,100%{transform:translateX(560px)}}
  .glow{animation:glow 3.6s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.12}50%{opacity:.3}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1000" height="110" fill="url(#bg)"/>
    <path d="M 0 70 H 1000" stroke="#3DCD58" stroke-opacity=".15"/>
    <circle r="3" cy="70" fill="#3DCD58"><animate attributeName="cx" from="-10" to="1010" dur="9s" repeatCount="indefinite"/></circle>
  </g>
  <rect x=".5" y=".5" width="999" height="109" rx="17.5" fill="none" stroke="#1E3646"/>
  <text x="500" y="46" text-anchor="middle" class="sans" font-size="17" font-weight="650" fill="#E8EEF2">Automation × Software</text>
  <text x="500" y="92" text-anchor="middle" class="mono" font-size="12" letter-spacing="1.5" fill="#93A5B2">FIELD EXPERTISE · ENGINEERED WITH CLAUDE</text>
</svg>
