<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-labelledby="t d">
  <title id="t">Focus areas</title>
  <desc id="d">Building automation, AI-assisted engineering with Claude, and web and mobile development.</desc>
  <defs><linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient><style>
  .sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
  .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
  /* Inhoud (tekst, kaarten, iconen) beweegt nooit: die is altijd zichtbaar, ook als een
     renderer animaties bevriest. Alleen decoratie beweegt: glans, stroming, lichtpuntjes. */
  .sweep{animation:sweep 7s cubic-bezier(.4,0,.2,1) infinite}
  @keyframes sweep{0%{transform:translateX(0)}55%,100%{transform:translateX(560px)}}
  .glow{animation:glow 3.6s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.12}50%{opacity:.3}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style></defs>
  
  <g>
    <rect x="8" y="10" width="312" height="250" rx="16" fill="#0F2230" stroke="#1E3646"/>
    <clipPath id="fc0"><rect x="8" y="10" width="312" height="250" rx="16"/></clipPath><g clip-path="url(#fc0)"><rect class="sweep" x="-162" y="10" width="160" height="250" fill="url(#sw)" style="animation-delay:0.8s"/></g>
    <circle cx="54" cy="56" r="30" fill="#3DCD58" opacity=".14" class="glow" style="animation-delay:0s"/>
    <rect x="32" y="34" width="44" height="44" rx="11" fill="#3DCD58" fill-opacity=".12" stroke="#3DCD58" stroke-opacity=".35"/>
