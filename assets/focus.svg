    <text x="32" y="114" class="sans" font-size="20" font-weight="650" fill="#E8EEF2">Building automation</text>
    <text x="32" y="146" class="sans" font-size="14.5" fill="#93A5B2">Schneider Electric EcoStruxure</text>
    <text x="32" y="168" class="sans" font-size="14.5" fill="#93A5B2">Building Operation. PLC logic,</text>
    <text x="32" y="190" class="sans" font-size="14.5" fill="#93A5B2">HVAC control, BACnet &amp; Modbus,</text>
    <text x="32" y="212" class="sans" font-size="14.5" fill="#93A5B2">upgrades and recovery.</text>
  </g>
  <g>
    <rect x="344" y="10" width="312" height="250" rx="16" fill="#0F2230" stroke="#1E3646"/>
    <clipPath id="fc1"><rect x="344" y="10" width="312" height="250" rx="16"/></clipPath><g clip-path="url(#fc1)"><rect class="sweep" x="174" y="10" width="160" height="250" fill="url(#sw)" style="animation-delay:2.2s"/></g>
    <circle cx="390" cy="56" r="30" fill="#D97757" opacity=".14" class="glow" style="animation-delay:0.9s"/>
    <rect x="368" y="34" width="44" height="44" rx="11" fill="#D97757" fill-opacity=".12" stroke="#D97757" stroke-opacity=".35"/>
    <g transform="translate(378 44) scale(1)" fill="none" stroke="#D97757" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></g>
    <text x="368" y="114" class="sans" font-size="20" font-weight="650" fill="#E8EEF2">AI-assisted engineering</text>
    <text x="368" y="146" class="sans" font-size="14.5" fill="#93A5B2">Claude and Claude Code to design,</text>
    <text x="368" y="168" class="sans" font-size="14.5" fill="#93A5B2">build and verify software faster,</text>
    <text x="368" y="190" class="sans" font-size="14.5" fill="#93A5B2">with the engineer accountable</text>
    <text x="368" y="212" class="sans" font-size="14.5" fill="#93A5B2">for every line.</text>
  </g>
  <g>
    <rect x="680" y="10" width="312" height="250" rx="16" fill="#0F2230" stroke="#1E3646"/>
    <clipPath id="fc2"><rect x="680" y="10" width="312" height="250" rx="16"/></clipPath><g clip-path="url(#fc2)"><rect class="sweep" x="510" y="10" width="160" height="250" fill="url(#sw)" style="animation-delay:3.5999999999999996s"/></g>
    <circle cx="726" cy="56" r="30" fill="#58A6FF" opacity=".14" class="glow" style="animation-delay:1.8s"/>
    <rect x="704" y="34" width="44" height="44" rx="11" fill="#58A6FF" fill-opacity=".12" stroke="#58A6FF" stroke-opacity=".35"/>
    <g transform="translate(714 44) scale(1)" fill="none" stroke="#58A6FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"></rect><path d="M12 18h.01"></path></g>
    <text x="704" y="114" class="sans" font-size="20" font-weight="650" fill="#E8EEF2">Web &amp; mobile</text>
    <text x="704" y="146" class="sans" font-size="14.5" fill="#93A5B2">React, Next.js, React Native and</text>
    <text x="704" y="168" class="sans" font-size="14.5" fill="#93A5B2">Expo. Offline-first, multilingual</text>
    <text x="704" y="190" class="sans" font-size="14.5" fill="#93A5B2">and production-ready, from</text>
    <text x="704" y="212" class="sans" font-size="14.5" fill="#93A5B2">design to release.</text>
